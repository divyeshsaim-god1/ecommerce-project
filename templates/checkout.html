<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
</head>
<body>
    <div id="form-container" class="form-container">
        <form id="submission-form">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="enter your name" required><br><br>

            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="mobile number" required><br><br>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="email address" required><br><br>

            <label for="address">Address</label>
            <textarea id="address" required></textarea><br><br>

            <button type="submit" class="submit-btn" id="checkout-form-submit-btn">
                Place Order
            </button>
        </form>
    </div>

    <p id="submit-msg"></p>

    <!-- JS script to handle form logic -->
    <script src="/static/checkout.js"></script>
    <script src="/static/buy.js"></script>
</body>
</html>
