<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Title and nav links -->
    <header class="header-content">
        <h2>ExtremeShopz</h2>
        <nav class="nav-links">
            <a href="#">HOME</a>
            <a href="#">CART</a>
            <a href="#">ABOUT</a>
        </nav>
    </header>

    <!-- categories -->
    <div class="categories">
            <span>household</span>
            <span>skincare</span>
            <span>appliances</span>
            <span>kids</span>
    </div>

    <!-- Search form and button -->
    <div id="search-form" class="search-form">
            <input id="input-form" type="text" placeholder="search...">
            <span class="search-btn"><button id="search-btn">search</button></span>
    </div>

    <!-- Main container to display the products -->
    <main class="product-grid">
            <div id="product" class="product">Product 1</div>
            <div id="product" class="product">Product 2</div>
            <div id="product" class="product">Product 3</div>
            <div id="product" class="product">Product 4</div>
            <div id="product" class="product">Product 5</div>
            <div id="product" class="product">Product 5</div>
        </main>
    </div>
</body>
</html>
